<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Sweets Sparkle</title>
<style>
  html, body { margin: 0; background: #000; }
  #stage { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
// お菓子の写真にキラキラ演出をかける 5 秒動画。
// window.render(t) で任意時刻のフレームを描画する（tools/render_sweets.mjs が書き出しに使う）。
const W = 1920, H = 1080;
window.DURATION = 5;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');

// 決定的な乱数（毎回同じ動画になるように）
function rng(seed) {
  return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };

const img = new Image();
const params = new URLSearchParams(location.search);
img.src = params.get('src') || 'sweets.webp';
// 色補正の強さ（元写真がすでに暖色なら弱める）: ?sat=0.45&bloom=1&warm=1&bright=0.47
const grade = ['sat', 'bloom', 'warm', 'bright'].reduce((o, k) => (params.has(k) ? { ...o, [k]: +params.get(k) } : o),
  { sat: 0.45, bloom: 1, warm: 1, bright: 0.47 });

let glints = [], bokeh = [], glitter = [], stars = [], bloomCanvas;

// 写真の明るいハイライト（つや・砂糖の反射）を探して、そこにキラッを置く
function findHighlights() {
  const sw = 240, sh = Math.round(240 * img.height / img.width);
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, sw, sh);
  const d = g.getImageData(0, 0, sw, sh).data;
  const lum = (x, y) => { const i = (y * sw + x) * 4; return 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]; };
  const all = [];
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) all.push(lum(x, y));
  all.sort((a, b) => a - b);
  const th = Math.min(200, all[Math.floor(all.length * 0.97)]); // 画像ごとの明るさの差を吸収
  const cand = [];
  for (let y = 2; y < sh - 2; y++) for (let x = 2; x < sw - 2; x++) {
    const l = lum(x, y);
    if (l < th) continue;
    let isMax = true;
    for (let dy = -2; dy <= 2 && isMax; dy++) for (let dx = -2; dx <= 2; dx++) {
      if ((dx || dy) && lum(x + dx, y + dy) > l) { isMax = false; break; }
    }
    // 周囲より明るい「点」ほどつやっぽい
    const around = (lum(x - 2, y) + lum(x + 2, y) + lum(x, y - 2) + lum(x, y + 2)) / 4;
    if (isMax) cand.push({ x: (x + 0.5) / sw, y: (y + 0.5) / sh, s: l + (l - around) * 2 });
  }
  cand.sort((a, b) => b.s - a.s);
  const out = [];
  for (const p of cand) {
    if (out.every((q) => Math.hypot((q.x - p.x) * 16, (q.y - p.y) * 9) > 0.55)) out.push(p);
    if (out.length >= 70) break;
  }
  return out;
}

function setup() {
  const r = rng(20260926);
  glints = findHighlights().map((p) => ({
    x: p.x, y: p.y,
    size: 26 + r() * 46,
    period: 0.9 + r() * 1.3,
    phase: r(),
    rot: r() * 0.6 - 0.3,
    hue: [48, 0, 330, 200, 50][Math.floor(r() * 5)],
  }));
  // 画面全体に舞うキラキラも追加
  for (let i = 0; i < 40; i++) glints.push({
    x: r(), y: r(), size: 18 + r() * 38, period: 0.8 + r() * 1.4, phase: r(), rot: r() * 0.6 - 0.3,
    hue: [48, 320, 190, 280][Math.floor(r() * 4)],
  });
  const bokehHues = [45, 330, 15, 200, 280, 120];
  for (let i = 0; i < 55; i++) bokeh.push({
    x: r() * W, y: r() * H * 1.3, r: 18 + r() * 60, speed: 60 + r() * 140,
    sway: 20 + r() * 50, swayF: 0.4 + r() * 0.8, hue: bokehHues[i % bokehHues.length], a: 0.12 + r() * 0.22, ph: r() * 6.28,
  });
  for (let i = 0; i < 420; i++) glitter.push({
    x: r() * W, y: r() * H, fall: 30 + r() * 110, drift: (r() - 0.5) * 60, s: 1.5 + r() * 3.5,
    tw: 3 + r() * 9, ph: r() * 6.28, hue: [45, 50, 0, 330, 190][Math.floor(r() * 5)],
  });
  // 冒頭のバースト：中心から星が飛び散る
  for (let i = 0; i < 90; i++) {
    const a = r() * Math.PI * 2, v = 500 + r() * 1300;
    stars.push({ a, v, size: 14 + r() * 30, spin: (r() - 0.5) * 8, hue: [48, 330, 190, 280, 20][i % 5], delay: r() * 0.25 });
  }
  // ブルーム用のぼかし画像
  bloomCanvas = document.createElement('canvas');
  bloomCanvas.width = W / 4; bloomCanvas.height = H / 4;
  const b = bloomCanvas.getContext('2d');
  b.filter = 'blur(6px) brightness(1.4) saturate(1.6)';
  b.drawImage(img, 0, 0, W / 4, H / 4);
}

// 写真のカメラワーク（ゆっくりズームイン＋少しパン）
function camera(t) {
  const k = ease(t / window.DURATION);
  const punch = 0.035 * Math.exp(-t * 5) * Math.cos(t * 18); // 冒頭のポンッとした弾み
  const s = 1.0 + 0.1 * k + punch;
  const cx = W / 2 + 40 * k, cy = H / 2 + 20 * k;
  return { s, cx, cy };
}
const toScreen = (cam, u, v) => ({ x: (u * W - cam.cx) * cam.s + W / 2, y: (v * H - cam.cy) * cam.s + H / 2 });

function drawStar(x, y, size, rot, hue, alpha, rays = 4) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  // 外側のにじみ
  const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.9);
  halo.addColorStop(0, `hsla(${hue},100%,85%,0.9)`);
  halo.addColorStop(0.3, `hsla(${hue},100%,65%,0.35)`);
  halo.addColorStop(1, `hsla(${hue},100%,60%,0)`);
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, size * 0.9, 0, Math.PI * 2); ctx.fill();
  // 十字の光条
  ctx.fillStyle = '#fff';
  for (let i = 0; i < rays; i++) {
    const len = i % 2 === 0 ? size * 1.6 : size * 1.1;
    ctx.beginPath();
    ctx.moveTo(0, -len);
    ctx.quadraticCurveTo(size * 0.06, -size * 0.06, len * 0.12, 0);
    ctx.quadraticCurveTo(size * 0.06, size * 0.06, 0, len);
    ctx.quadraticCurveTo(-size * 0.06, size * 0.06, -len * 0.12, 0);
    ctx.quadraticCurveTo(-size * 0.06, -size * 0.06, 0, -len);
    ctx.fill();
    ctx.rotate(Math.PI / 2);
    if (rays === 8 && i === 3) ctx.rotate(Math.PI / 4);
  }
  ctx.beginPath(); ctx.arc(0, 0, size * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function render(t) {
  const cam = camera(t);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // 1. 写真（彩度・コントラストを上げてシズル感）
  const intro = ease(t / 0.35);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(cam.s, cam.s); ctx.translate(-cam.cx, -cam.cy);
  ctx.filter = `saturate(${1.0 + grade.sat * intro}) contrast(${1 + 0.1 * intro}) brightness(${0.6 + grade.bright * intro})`;
  ctx.drawImage(img, 0, 0, W, H);
  ctx.filter = 'none';
  // 2. ブルーム（ふわっと光る。ゆっくり脈動）
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = (0.14 + 0.1 * Math.sin(t * Math.PI * 1.6) ** 2) * grade.bloom;
  ctx.drawImage(bloomCanvas, 0, 0, W, H);
  ctx.restore();

  // 3. 暖色のグロー（中央を明るく、四隅を落とす）
  ctx.globalCompositeOperation = 'soft-light';
  ctx.globalAlpha = 1;
  const warm = ctx.createRadialGradient(W / 2, H * 0.55, 100, W / 2, H * 0.55, W * 0.7);
  warm.addColorStop(0, `rgba(255,215,160,${0.45 * grade.warm})`);
  warm.addColorStop(1, `rgba(255,120,90,${0.1 * grade.warm})`);
  ctx.fillStyle = warm; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.72);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(40,0,20,0.55)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  // 4. 光の帯（シャイン）が斜めに走る ×3
  for (const [t0, dur, a] of [[0.35, 0.9, 0.55], [2.0, 0.9, 0.45], [3.6, 0.9, 0.5]]) {
    const p = (t - t0) / dur;
    if (p < 0 || p > 1) continue;
    const x = -600 + p * (W + 1200);
    ctx.save();
    ctx.translate(x, H / 2); ctx.rotate(-0.45);
    const g = ctx.createLinearGradient(-260, 0, 260, 0);
    g.addColorStop(0, 'rgba(255,240,200,0)');
    g.addColorStop(0.42, `rgba(255,235,190,${a * 0.5})`);
    g.addColorStop(0.5, `rgba(255,255,255,${a})`);
    g.addColorStop(0.58, `rgba(255,235,190,${a * 0.5})`);
    g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; ctx.fillRect(-260, -1400, 520, 2800);
    ctx.restore();
  }

  // 5. ボケ玉（下からふわふわ上がる）
  for (const b of bokeh) {
    let y = b.y - t * b.speed; y = ((y % (H * 1.3)) + H * 1.3) % (H * 1.3) - H * 0.15;
    const x = b.x + Math.sin(t * b.swayF * 6.28 + b.ph) * b.sway;
    const a = b.a * (0.6 + 0.4 * Math.sin(t * 3 + b.ph)) * ease(t / 0.6);
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    g.addColorStop(0, `hsla(${b.hue},100%,75%,${a})`);
    g.addColorStop(0.7, `hsla(${b.hue},100%,65%,${a * 0.7})`);
    g.addColorStop(1, `hsla(${b.hue},100%,60%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.fill();
  }

  // 6. グリッター（金粉が舞い落ちながら瞬く）
  for (const p of glitter) {
    const x = ((p.x + t * p.drift) % W + W) % W;
    const y = ((p.y + t * p.fall) % H + H) % H;
    const tw = Math.max(0, Math.sin(t * p.tw + p.ph));
    const a = tw ** 3 * ease(t / 0.5);
    if (a < 0.02) continue;
    ctx.fillStyle = `hsla(${p.hue},100%,${70 + 25 * tw}%,${a})`;
    ctx.beginPath(); ctx.arc(x, y, p.s * (0.6 + tw), 0, Math.PI * 2); ctx.fill();
    if (tw > 0.85) drawStar(x, y, p.s * 4, 0.3, p.hue, a * 0.8);
  }

  // 7. ハイライトのキラッ（お菓子のつやの位置で瞬く）
  for (const g of glints) {
    const ph = ((t / g.period + g.phase) % 1);
    const pulse = Math.max(0, Math.sin(ph * Math.PI)) ** 4;
    if (pulse < 0.02) continue;
    const p = toScreen(cam, g.x, g.y);
    drawStar(p.x, p.y, g.size * (0.4 + 0.8 * pulse), g.rot + t * 0.8, g.hue, pulse * ease((t - 0.2) / 0.4));
  }

  // 8. 冒頭のバースト（フラッシュ＋星が飛び散る）
  if (t < 0.5) {
    ctx.globalAlpha = (1 - t / 0.5) ** 2 * 0.85;
    const f = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
    f.addColorStop(0, 'rgba(255,255,240,1)');
    f.addColorStop(0.4, 'rgba(255,220,160,0.5)');
    f.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.fillStyle = f; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  for (const s of stars) {
    const lt = t - 0.05 - s.delay;
    if (lt < 0 || lt > 1.6) continue;
    const d = s.v * (1 - Math.exp(-lt * 2.6)) / 2.6 * 1.6;
    const x = W / 2 + Math.cos(s.a) * d, y = H / 2 + Math.sin(s.a) * d + 120 * lt * lt;
    drawStar(x, y, s.size * (1 - lt / 1.6 * 0.5), s.spin * lt, s.hue, 1 - ease(lt / 1.6), 8);
  }

  // 9. 光のリング（ラストで「キラーン」）
  for (const [t0, x, y] of [[4.1, 0.42, 0.62], [4.35, 0.72, 0.42]]) {
    const lt = t - t0;
    if (lt < 0 || lt > 0.7) continue;
    const a = 1 - lt / 0.7;
    drawStar(x * W, y * H, 90 + 160 * ease(lt / 0.25), lt * 2, 48, a, 8);
    ctx.strokeStyle = `rgba(255,240,200,${a * 0.7})`; ctx.lineWidth = 6 * a + 1;
    ctx.beginPath(); ctx.arc(x * W, y * H, 40 + lt * 500, 0, Math.PI * 2); ctx.stroke();
  }

  // 10. 終わりの余韻：全体をほんのり白く光らせてフェード
  const out = ease((t - 4.6) / 0.4);
  if (out > 0) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = out * 0.25;
    ctx.fillStyle = '#fff5e6'; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
window.render = render;

img.onload = () => {
  setup();
  window.READY = true;
  if (!location.search.includes('render=1')) {
    const start = performance.now();
    const loop = () => { render(((performance.now() - start) / 1000) % window.DURATION); requestAnimationFrame(loop); };
    loop();
  }
};
</script>
</body>
</html>
